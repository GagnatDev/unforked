packages:
  - frontend
  - backend

allowBuilds:
  cpu-features: false
  esbuild: false
  protobufjs: false
  sharp: true
  ssh2: false

# Hold releases published after 2026-11-26T08:24Z that are not security fixes.
# Drop a pin once that release is older than 24 hours.
overrides:
  baseline-browser-mapping: 2.11.39
  electron-to-chromium: 1.5.494
  "js-tokens@^10": 10.0.1
  lucide-react: 1.81.0
  node-releases: 2.0.65
  "readable-stream@3>string_decoder": 1.3.0
  "readable-stream@4>string_decoder": 1.3.0
  tldts: 7.6.0
  tldts-core: 7.6.0
  vite: 8.3.8
